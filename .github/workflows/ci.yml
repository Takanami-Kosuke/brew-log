# main へのプッシュと Pull Request のたびに、lint・型チェック・テスト・ビルドを実行する
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 依存パッケージのインストール
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 型チェック
        run: npx tsc -b

      - name: テスト
        run: npm test

      - name: ビルド
        run: npm run build
